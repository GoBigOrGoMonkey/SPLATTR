<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — SPLATTR!</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    .not-found { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-inline: 1rem; text-align: center; }
    .not-found > div { max-width: 28rem; }
    .not-found h1 { font-size: 4.5rem; line-height: 1; font-weight: 700; }
    .not-found h2 { margin-top: 1rem; font-size: 1.25rem; line-height: 1.75rem; font-weight: 600; }
    .not-found p { margin-top: 0.5rem; font-size: 0.875rem; line-height: 1.25rem; color: var(--muted-foreground); }
    .not-found .btn { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="not-found">
    <div>
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a class="btn btn-primary" href="/">Go home</a>
    </div>
  </div>
</body>
</html>
